- id: undo-restores-the-state-you-are-already-in
  type: bug
  what: "commit() snapshots state.project AFTER the tools have mutated it in place, so the undo stack\
    \ holds post-states: the first press of Undo does nothing, every later press is one step behind, and\
    \ the first change of a session can never be undone. Measured in Chromium: place R1, place R2, Undo\
    \ \u2014 both parts still there and the status line says 'undone'."
