<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stripex — stripboard editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e8dcc0'/%3E%3Crect y='2' width='16' height='3' fill='%23b87333'/%3E%3Crect y='7' width='16' height='3' fill='%23b87333'/%3E%3Crect y='12' width='16' height='3' fill='%23b87333'/%3E%3Ccircle cx='4' cy='3.5' r='1' fill='%23241f18'/%3E%3Ccircle cx='11' cy='8.5' r='1' fill='%23241f18'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!--
  The icon set, drawn rather than borrowed from a font.

  The first attempt used typographic glyphs — ⟳ ↶ ↷ ⭳ ⭱ ⭯ ⧉ — and Peter's verdict
  was "tiny / illegible, impossible to figure out what a button is for". He was
  right: those characters render at whatever size and weight the font decides,
  several have no glyph in common fonts and fall back to a box, and none of them
  is a shape anyone has been taught.

  These are 24×24 strokes on currentColor, so they take the button's colour in
  both themes, scale with it, and are the shapes people already know from every
  other editor. Every button keeps its title and aria-label as well: the drawing
  is a reminder, not the only way to know.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-rotate" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>
    </g>
    <g id="i-undo" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10h9a5 5 0 0 1 0 10h-3"/><path d="M8 6l-4 4 4 4"/>
    </g>
    <g id="i-redo" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10h-9a5 5 0 0 0 0 10h3"/><path d="M16 6l4 4-4 4"/>
    </g>
    <g id="i-download" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 19h16"/>
    </g>
    <g id="i-upload" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 19h16"/>
    </g>
    <g id="i-restore" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/>
    </g>
    <!-- A wire link: a straight, stiff wire between two pads — the pen wire's
         icon is the curved one. -->
    <g id="i-link" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4.5" r="2.5"/><circle cx="12" cy="19.5" r="2.5"/>
      <path d="M12 7v10"/>
    </g>
    <g id="i-print" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9V3h12v6"/>
      <rect x="3" y="9" width="18" height="8" rx="2"/>
      <path d="M6 14h12v7H6z"/>
    </g>
    <g id="i-export" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
      <path d="M14 3v5h5"/><path d="M21 3l-7 7"/>
    </g>
    <g id="i-theme" stroke="currentColor" stroke-width="2" fill="none">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-boards" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M3 9h18"/><path d="M8 4v16"/>
    </g>
    <!-- A chip with its legs: the component catalogue. -->
    <g id="i-chip" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="7" width="10" height="10" rx="1"/>
      <path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/>
    </g>

    <!-- The six tools. Each is the thing it does to the board, not an
         abstraction of it: a pointer, a chip, a knife, a wire, a compass of
         arrows, a bin. -->
    <g id="i-select" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3l14 8-6 1.6L10 19z" fill="currentColor" stroke="none"/>
      <path d="M5 3l14 8-6 1.6L10 19z"/>
    </g>
    <g id="i-place" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="12" height="8" rx="1"/>
      <path d="M4 10h2M4 14h2M18 10h2M18 14h2"/>
      <path d="M12 2v4"/><path d="M10 4l2 2 2-2"/>
    </g>
    <g id="i-break" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h6"/><path d="M15 12h6"/>
      <path d="M10 7l4 10"/>
    </g>
    <g id="i-wire" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/>
      <path d="M7 16.5C10 13 9 9 12 9s5 3 5 3"/>
    </g>
    <g id="i-move" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M3 12h18"/>
      <path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>
    </g>
    <g id="i-delete" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16"/><path d="M10 4h4"/>
      <path d="M6 7l1 13h10l1-13"/>
      <path d="M10 11v6M14 11v6"/>
    </g>

    <!-- The two ways to cut a strip. A knife blade for the cut between two
         holes; crosshairs for the spot-face, which is drilled AT a hole. -->
    <g id="i-knife" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16l9-11 3 3-8 10H4z"/>
      <path d="M14 18h6"/>
    </g>
    <g id="i-spot" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="6"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </g>
  </defs>
</svg>

<header class="bar">
  <span class="brand">stripex</span>

  <!-- GROUPED BY WHAT THEY DO TO THE BOARD, not by how often they are used.
       First the tools that act on something already there, then the ones that
       put something new on it, then history. A separator between each, so the
       eye finds the group before it finds the button. -->
  <div class="tools" role="toolbar" aria-label="Edit what is there">
    <button class="tool iconbtn" data-tool="select" title="Select (V)" aria-label="Select">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-select"/></svg></button>
    <button class="tool iconbtn" data-tool="move" title="Move a device by one of its pins (M)"
      aria-label="Move"><svg class="ico" viewBox="0 0 24 24"><use href="#i-move"/></svg></button>
    <button id="rotate" class="iconbtn" title="Rotate (R)" aria-label="Rotate">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-rotate"/></svg></button>
    <button class="tool iconbtn" data-tool="delete" title="Delete (X)" aria-label="Delete">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-delete"/></svg></button>
  </div>

  <div class="sep"></div>

  <div class="tools" role="toolbar" aria-label="Add to the board">
    <button class="tool iconbtn" data-tool="place" title="Place the palette part (P)"
      aria-label="Place"><svg class="ico" viewBox="0 0 24 24"><use href="#i-place"/></svg></button>
    <button class="tool iconbtn" data-tool="wire" title="Draw a pen wire (W)"
      aria-label="Wire"><svg class="ico" viewBox="0 0 24 24"><use href="#i-wire"/></svg></button>
    <!-- A WIRE LINK, one click away like the pen wire. Peter: "there needs to be
         a quick action button for Wire Link, next to pen link." It arms Place
         with the link, exactly as the Library does; data-quick-part rather than
         data-part so nothing looking for Library items mistakes it for one. -->
    <button class="tool iconbtn" data-tool="place" data-quick-part="wire-link"
      title="Place a wire link — across the strips" aria-label="Wire link">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-link"/></svg></button>
  </div>

  <div class="sep"></div>

  <!-- THE TWO WAYS TO CUT, their own group. Both arm the break tool; each
       carries its own cut style, and the lit one says which without anything
       being opened. They are a pair and they are not "adding" anything, so they
       sit apart from place and wire rather than trailing off the end of them. -->
  <div class="tools" role="toolbar" aria-label="Cut a strip">
    <button class="tool iconbtn" data-tool="break" data-cut="gap"
      title="Knife — cut a strip between two holes (B)" aria-label="Knife cut">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-knife"/></svg></button>
    <button class="tool iconbtn" data-tool="break" data-cut="hole"
      title="Spot-face — drill the copper away at a hole" aria-label="Spot-face">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-spot"/></svg></button>
  </div>

  <div class="sep"></div>

  <div class="group" role="group" aria-label="History">
    <button id="undo" class="iconbtn" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
    <button id="redo" class="iconbtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-redo"/></svg></button>
  </div>

  <div class="sep"></div>

  <!-- Two options behind a dropdown cost two clicks and a menu; two buttons cost
       one, and say which side you are looking at without being opened. Marked
       with is-on, the same idiom the tool buttons use. -->
  <div class="group" role="group" aria-label="View">
    <button class="viewbtn is-on" data-view="top"
      title="Top — the component side">Top</button>
    <button class="viewbtn" data-view="underside"
      title="Bot — the solder side, mirrored">Bot</button>
    <!-- PRINT IS A VIEW. Peter: "add another button print ... such that it
         renders a panel where top / bot would be". The internal name of the
         bottom view stays `underside`; only what a person reads changed. -->
    <button class="viewbtn" data-view="print"
      title="Print — choose the page, the layers and the tables">Print</button>
  </div>

  <div class="group">
    <label>Board
      <input id="cols" type="number" min="4" max="120" value="25" title="columns"> ×
      <input id="rows" type="number" min="2" max="120" value="20" title="rows">
    </label>
  </div>

  <div class="spacer"></div>

  <div class="group">
    <!-- The board this is. Saving is automatic and continuous, so there is no
         Save here for it: this button is how you pick another board or start
         one, which had no way in at all while the board list lived only inside
         a collapsed card. -->
    <button id="boards" class="iconbtn" title="Pick a board, or start a new one" aria-label="Boards">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-boards"/></svg><span id="boardLabel">Boards</span></button>
    <!-- LABELLED, AND BESIDE BOARDS. It was an unlabelled icon at the far right
         of six file-operation buttons and Peter could not find it: "so where is
         the new component / library editor you added?" A component catalogue is
         a document-level thing like the board list, not a file operation, and at
         36 px a chip with eight legs reads as a smudge. -->
    <button id="components" class="iconbtn" title="Add or correct a component"
      aria-label="Components">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-chip"/></svg><span>Components</span></button>
    <span id="saveState" class="save-state" title="Saved automatically to the server"></span>
  </div>

  <div class="group">
    <button id="theme" class="iconbtn" title="Light / dark" aria-label="Light or dark theme">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-theme"/></svg></button>
    <!-- Download / upload a COPY. The board itself lives on the server and
         saves itself; these are for handing someone a file. -->
    <button id="save" class="iconbtn" title="Download a copy of this board as a file"
      aria-label="Download a copy">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-download"/></svg></button>
    <button id="load" class="iconbtn" title="Open a board from a file on this machine"
      aria-label="Open from a file">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-upload"/></svg></button>
    <button id="restore" class="iconbtn" title="Go back to an earlier snapshot"
      aria-label="Restore an earlier snapshot">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-restore"/></svg></button>
    <button id="export" class="iconbtn" title="Export the board as an SVG"
      aria-label="Export as SVG">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-export"/></svg></button>
  </div>
</header>

<!-- What actually goes to paper. Empty and hidden on screen; built on Print,
     and under @media print it is the only thing shown. -->
<section id="printSheet" aria-hidden="true"></section>

<main>
  <!-- Cards, built from CARDS in src/render/panels.js. Each owns the settings
       that belong to it; arming a tool opens its card. -->
  <aside class="panel left" id="cards"></aside>

  <section class="stage" id="stage">
    <div id="boardWrap" class="board-wrap"></div>
    <!-- THE PRINT VIEW, in the board's place. Settings, layers and tables on the
         left, the page itself on the right, Print at the top right. What the
         preview shows is built by the same function as what goes to paper.
         See docs/specs/print-view.md. -->
    <section id="printView" class="pv" hidden aria-label="Print">
      <div class="pv-bar">
        <h2>Print</h2>
        <span id="pvFit" class="pv-fit" aria-live="polite"></span>
        <button type="button" id="pvPrint" class="primary">Print</button>
      </div>
      <div class="pv-body">
        <aside class="pv-options">
          <h3>Page</h3>
          <span class="devseg" role="group" aria-label="Colour">
            <button type="button" class="devseg-opt" data-print-colour="colour">Colour</button>
            <button type="button" class="devseg-opt" data-print-colour="mono">Black &amp; white</button>
          </span>
          <span class="devseg" role="group" aria-label="Sides">
            <button type="button" class="devseg-opt" data-print-sides="top">Top</button>
            <button type="button" class="devseg-opt" data-print-sides="underside">Bot</button>
            <button type="button" class="devseg-opt" data-print-sides="both">Both</button>
          </span>
          <span class="devseg" role="group" aria-label="Size">
            <button type="button" class="devseg-opt" data-print-size="actual">Actual size</button>
            <button type="button" class="devseg-opt" data-print-size="fill">Fill the page</button>
          </span>
          <h3>Layers</h3>
          <div id="pvLayers" class="pv-checks"></div>
          <h3>Tables</h3>
          <div class="pv-checks">
            <label><input type="checkbox" data-print-table="bom"> Bill of materials</label>
            <label><input type="checkbox" data-print-table="cuts"> Cut list</label>
            <label><input type="checkbox" data-print-table="wires"> Wire runs</label>
          </div>
        </aside>
        <div id="pvPreview" class="pv-preview"><div class="pv-page"><div class="pv-sheet"></div></div></div>
      </div>
    </section>
    <p class="status" id="status"></p>
  </section>

  <aside class="panel right">
    <!-- Tabs and bodies are built from TABS in src/render/panels.js, so the
         labels and the ids exist in exactly one place. -->
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="tabBodies"></div>
  </aside>
</main>

<!-- THE COMPONENT EDITOR, over the board rather than beside it.
     A device has sixteen pin names, a footprint and a preview; none of that
     fits in a panel next to a board, and editing a component is not something
     done while laying one out. The board is left exactly as it was underneath,
     which is why this hides rather than replaces. -->
<section class="screen" id="componentsScreen" hidden>
  <header class="screen-head">
    <button id="devBack" class="linky">&#8592; back to the board</button>
    <h2>Components</h2>
    <span class="screen-sub">The built-in ones are stock. Anything you change is
      kept in <code>devices.json</code> and can be put back.</span>
  </header>
  <div class="components">
    <aside class="devlist">
      <div class="devsearch">
        <input id="devSearch" type="search" placeholder="Search components"
          aria-label="Search components">
        <button id="devNew" class="linky">+ New</button>
      </div>
      <div id="devList"></div>
    </aside>

    <!-- THE DATASHEET. A manufacturer's page is a package drawing with numbered
         pins beside a pin table, and that is exactly this content. The drawing
         is the hero and the table is its index; they are one instrument, linked
         by selection in both directions. -->
    <div class="devpane">
      <header class="devhead">
        <div class="devtitle">
          <h3 id="devName">Choose a component</h3>
          <p id="devSpec" class="devspec"></p>
        </div>
        <div class="devactions">
          <span id="devStatus" class="devstatus" role="status"></span>
          <button id="devRevert" class="linky" hidden>Back to stock</button>
          <button id="devSave" class="primary">Save</button>
        </div>
      </header>
      <div class="devbody">
        <figure id="devPreview" class="devpreview">
          <figcaption>As it sits on the board</figcaption>
          <div id="devDrawing" class="devdrawing"></div>
        </figure>
        <div id="devEdit" class="devedit"></div>
      </div>
    </div>
  </div>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
