<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stripex — stripboard editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e8dcc0'/%3E%3Crect y='2' width='16' height='3' fill='%23b87333'/%3E%3Crect y='7' width='16' height='3' fill='%23b87333'/%3E%3Crect y='12' width='16' height='3' fill='%23b87333'/%3E%3Ccircle cx='4' cy='3.5' r='1' fill='%23241f18'/%3E%3Ccircle cx='11' cy='8.5' r='1' fill='%23241f18'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <span class="brand">stripex</span>

  <div class="tools" role="toolbar" aria-label="Tools">
    <button class="tool" data-tool="select" title="Select and move (V)"><span>▶</span>Select</button>
    <button class="tool" data-tool="place"  title="Place the palette part (P)"><span>⬒</span>Place</button>
    <button class="tool" data-tool="break"  title="Cut or restore a strip (B)"><span>✂</span>Break</button>
    <button class="tool" data-tool="wire"   title="Draw a pen wire (W)"><span>⌇</span>Wire</button>
    <button class="tool" data-tool="move"   title="Move a device by one of its pins (M)"><span>✥</span>Move</button>
    <button class="tool" data-tool="delete" title="Delete (X)"><span>⌫</span>Delete</button>
  </div>

  <div class="sep"></div>

  <div class="group">
    <button id="rotate" title="Rotate the pending part (R)">Rotate</button>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>

  <div class="sep"></div>

  <div class="group">
    <label>View
      <select id="view">
        <option value="top">Top (component side)</option>
        <option value="underside">Underside (solder side)</option>
      </select>
    </label>
    <label>Board
      <input id="cols" type="number" min="4" max="120" value="25" title="columns"> ×
      <input id="rows" type="number" min="2" max="120" value="20" title="rows">
    </label>
  </div>

  <div class="spacer"></div>

  <div class="group">
    <button id="theme" title="Light / dark">◐</button>
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="export">Export SVG</button>
  </div>
</header>

<main>
  <aside class="panel left">
    <h2>Parts</h2>
    <div id="palette" class="palette"></div>
    <label class="span-row">Span
      <input id="span" type="number" min="1" max="40" value="4">
      <span id="spanLabel" class="hint"></span>
    </label>
    <label class="span-row" id="widthRow">Width
      <input id="width" type="number" min="2" max="12" value="3">
      <span id="widthLabel" class="hint"></span>
    </label>
    <p class="hint" id="paletteHint"></p>

    <h2 class="layers-head">Cut with</h2>
    <div class="cuts">
      <label><input type="radio" name="cut" value="gap" checked>
        <span>Knife — between two holes</span></label>
      <label><input type="radio" name="cut" value="hole">
        <span>Spot-face cutter — at a hole</span></label>
    </div>
    <p class="hint">A spot-face kills the hole as well as the track: nothing
      soldered there connects to anything.</p>

    <h2 class="layers-head">Layers
      <button id="layersAll" class="linky" title="Show every layer">all</button>
    </h2>
    <div id="layers" class="layers"></div>
  </aside>

  <section class="stage" id="stage">
    <div id="boardWrap" class="board-wrap"></div>
    <p class="status" id="status"></p>
  </section>

  <aside class="panel right">
    <!-- Tabs and bodies are built from TABS in src/render/panels.js, so the
         labels and the ids exist in exactly one place. -->
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="tabBodies"></div>
  </aside>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
